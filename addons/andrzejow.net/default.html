<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>andrzejow.net</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #212529;
        }
        
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 2rem;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        h1 {
            font-size: clamp(2.5rem, 5vw, 5rem);
            margin: 0 0 0.5rem 0;
            font-weight: 700;
        }

        p {
            font-size: clamp(1.1rem, 2vw, 1.5rem);
            color: #6c757d;
            margin: 0 0 2rem 0;
        }

        .image-container {
            width: 100%;
            max-width: 800px;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <h1>Osiedle Andrzejow </h1>
    
    <div class="image-container">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/03/Lodz_Widzew_Andzejow_SIM.svg" alt="Prosty obrazek powitalny" width="800" height="500" loading="lazy">
    </div>
    <p>Masz pomysł na stronę, zapraszam do kontaktu: 
        <script>
            document.write('<a href="mailto:' + 'andrzejow.net' + '@' + 'gmail.com">' + 'andrzejow.net' + '@' + 'gmail.com</a>');
        </script>
        <noscript>andrzejow.net (małpa) gmail.com</noscript>
    </p>
</body>
</html>
