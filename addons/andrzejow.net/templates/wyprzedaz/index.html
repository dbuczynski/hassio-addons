<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_title|default('Wyprzedaż Sprzętu - Galeria i Oferty') }}</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.85);
            --bg-card-hover: rgba(30, 41, 59, 0.98);
            --accent-primary: #6366f1;
            --accent-gold: #f59e0b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --glass-blur: blur(16px);
            --radius-lg: 18px;
            --radius-md: 10px;
            --radius-sm: 6px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(245, 158, 11, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-title {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 40%, var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--accent-gold), #d97706);
            color: #fff;
            border: none;
        }
        .btn-gold:hover {
            background: linear-gradient(135deg, #d97706, #b45309);
        }

        .main-container {
            max-width: 1400px;
            width: 95%;
            margin: 24px auto;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 24px;
            flex: 1;
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px;
        }

        /* Sidebar Categories Tree */
        .category-tree-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 14px;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cat-item {
            padding: 8px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text-muted);
            transition: all 0.15s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .cat-item:hover, .cat-item.active {
            background: rgba(99, 102, 241, 0.15);
            color: #fff;
        }
        .cat-item.active {
            font-weight: 700;
            border-left: 3px solid var(--accent-primary);
        }

        .cat-sub-list {
            border-left: 1px dashed rgba(255, 255, 255, 0.1);
            padding-left: 4px;
            margin-bottom: 4px;
        }

        /* Filter Controls */
        .controls-bar {
            display: flex;
            gap: 14px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 10px 16px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .search-input:focus {
            border-color: var(--accent-primary);
        }

        .sort-select {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 10px 16px;
            color: #fff;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        /* Compact Layout Picker */
        .layout-picker-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
        }
        .layout-picker-trigger {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 8px 11px;
            color: #e2e8f0;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            white-space: nowrap;
            height: 100%;
        }
        .layout-picker-trigger:hover,
        .layout-picker-trigger.open {
            border-color: var(--accent-primary);
            color: #fff;
            background: rgba(99, 102, 241, 0.14);
        }
        .layout-picker-badge {
            background: rgba(99, 102, 241, 0.22);
            color: #c7d2fe;
            padding: 2px 6px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }
        .layout-popover {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            background: #131c31;
            border: 1px solid rgba(99, 102, 241, 0.4);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
            z-index: 200;
            display: none;
            min-width: 220px;
            backdrop-filter: blur(12px);
        }
        .layout-popover.open {
            display: block;
        }
        .layout-popover-section + .layout-popover-section {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .layout-popover-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 5px;
        }
        .layout-pills {
            display: flex;
            gap: 5px;
            flex-wrap: nowrap;
        }
        .layout-pill-btn {
            flex: 1;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 5px 8px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease;
            white-space: nowrap;
        }
        .layout-pill-btn:hover {
            border-color: var(--accent-primary);
            color: #fff;
        }
        .layout-pill-btn.active {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: #fff;
            font-weight: 700;
        }

        /* Product Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .products-grid.grid-cols-3 {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .products-grid.grid-cols-4 {
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }
        .products-grid.grid-cols-5 {
            grid-template-columns: repeat(5, minmax(0, 1fr));
        }
        @media (max-width: 1200px) {
            .products-grid.grid-cols-5 {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }
        @media (max-width: 960px) {
            .products-grid.grid-cols-4,
            .products-grid.grid-cols-5 {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }
        @media (max-width: 720px) {
            .products-grid.grid-cols-3,
            .products-grid.grid-cols-4,
            .products-grid.grid-cols-5 {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
        @media (max-width: 480px) {
            .products-grid.grid-cols-3,
            .products-grid.grid-cols-4,
            .products-grid.grid-cols-5 {
                grid-template-columns: 1fr;
            }
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.25s ease;
            cursor: pointer;
            position: relative;
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            border-color: var(--accent-primary);
        }

        .product-img-wrapper {
            width: 100%;
            height: 210px;
            background: rgba(15, 23, 42, 0.85);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
        }
        .product-img-wrapper img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            transition: transform 0.3s ease, filter 0.3s ease, opacity 0.3s ease;
        }
        .product-card:hover .product-img-wrapper img {
            transform: scale(1.04);
        }

        /* Out of Stock Grayscale Styling */
        .product-img-wrapper.out-of-stock img {
            filter: grayscale(100%);
            opacity: 0.55;
        }

        .badge-out-of-stock {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(239, 68, 68, 0.92);
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            white-space: nowrap;
            z-index: 5;
        }

        .badge-img-count {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            padding: 3px 8px;
            border-radius: var(--radius-sm);
            font-size: 11px;
            font-weight: 600;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .badge-category {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(99, 102, 241, 0.85);
            backdrop-filter: blur(4px);
            padding: 3px 10px;
            border-radius: var(--radius-sm);
            font-size: 11px;
            font-weight: 700;
            color: #fff;
        }

        .product-info {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 8px;
        }
        .product-title {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            line-height: 1.3;
        }
        .product-price {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent-gold);
        }
        .product-price.out-of-stock-price {
            color: #fca5a5;
        }
        .product-desc-short {
            font-size: 12.5px;
            color: var(--text-muted);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-top: auto;
        }

        /* Modal Details */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            padding: 24px;
            position: relative;
        }

        @media (max-width: 768px) {
            .modal-content {
                grid-template-columns: 1fr;
            }
        }

        .modal-close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            font-size: 20px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close-btn:hover { background: rgba(239, 68, 68, 0.4); }

        .modal-main-img-box {
            width: 100%;
            height: 340px;
            border-radius: var(--radius-md);
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            overflow: hidden;
            position: relative;
        }
        .modal-main-img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: var(--radius-sm);
            transition: filter 0.3s ease, transform 0.2s ease;
            cursor: zoom-in;
        }
        .modal-main-img:hover {
            transform: scale(1.02);
        }
        .modal-main-img.out-of-stock {
            filter: grayscale(100%);
            opacity: 0.6;
        }

        .modal-thumbnails {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            overflow-x: auto;
            padding-bottom: 4px;
            align-items: center;
        }
        .modal-thumb {
            width: 64px;
            height: 64px;
            object-fit: contain;
            background: rgba(15, 23, 42, 0.9);
            padding: 3px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            opacity: 0.6;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .modal-thumb.active, .modal-thumb:hover {
            opacity: 1;
            border-color: var(--accent-gold);
        }

        /* Fullscreen Image Lightbox */
        .fullscreen-img-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 10, 22, 0.95);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2500;
            padding: 20px;
        }
        .fullscreen-img-overlay img {
            max-width: 95vw;
            max-height: 92vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: var(--radius-md);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85);
        }
        .fullscreen-close-btn {
            position: fixed;
            top: 20px;
            right: 24px;
            background: rgba(239, 68, 68, 0.85);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.25);
            font-size: 22px;
            font-weight: 800;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2510;
            transition: all 0.2s ease;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
        }
        .fullscreen-close-btn:hover {
            background: #ef4444;
            transform: scale(1.08);
        }
        .count-badge {
            background: rgba(15, 23, 42, 0.8);
            padding: 2px 7px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            margin-left: 6px;
        }

        /* Pagination Controls */
        .pagination-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 24px;
            flex-wrap: wrap;
        }
        .page-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .page-btn:hover:not(:disabled) {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--accent-primary);
            color: #fff;
        }
        .page-btn.active {
            background: var(--accent-primary);
            color: #fff;
            border-color: var(--accent-primary);
            font-weight: 700;
        }
        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .page-info {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
            margin: 0 4px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand-title">
            <span>{{ app_heading|default('🏷️ Wyprzedaż Sprzętu') }}</span>
        </div>
        <div class="nav-actions">
            {% if is_admin_ip %}
            <a href="{{ app_base_path|default('/wyprzedaz') }}/admin" class="btn btn-gold">🔒 Panel Admina</a>
            {% endif %}
            <a href="/" class="btn">🏠 Strona Główna</a>
        </div>
    </nav>

    <div class="main-container">
        <!-- Sidebar Category Tree -->
        <div class="card">
            <div class="category-tree-title">📁 Drzewo Kategorii</div>
            <div id="category-tree-container">
                <div class="cat-item active" onclick="selectCategory(null)">
                    <span>Wszystkie kategorie</span>
                </div>
            </div>
        </div>

        <!-- Main Product Area -->
        <div>
            <div class="controls-bar">
                <input type="text" id="search-input" class="search-input" placeholder="🔍 Szukaj sprzętu (np. Wkręt Dew, 'Wkrętarka Bosch')..." oninput="filterProducts()">
                <div class="layout-picker-wrapper" id="layout-picker-wrapper">
                    <button type="button" id="layout-picker-trigger" class="layout-picker-trigger" onclick="toggleLayoutPopover(event)" title="Układ wyświetlania (elementów w rzędzie / na stronę)">
                        <span>⊞</span>
                        <span id="layout-picker-summary" class="layout-picker-badge">3 / 6</span>
                        <span style="font-size:10px; opacity:0.7;">▾</span>
                    </button>
                    <div id="layout-popover" class="layout-popover" onclick="event.stopPropagation()">
                        <div class="layout-popover-section">
                            <div class="layout-popover-label">W rzędzie (kolumny)</div>
                            <div class="layout-pills" id="layout-cols-pills"></div>
                        </div>
                        <div class="layout-popover-section">
                            <div class="layout-popover-label">Ilość (maks. na stronę)</div>
                            <div class="layout-pills" id="layout-rows-pills"></div>
                        </div>
                    </div>
                </div>
                <select id="sort-select" class="sort-select" onchange="filterProducts()">
                    <option value="newest">Najnowsze wpisy</option>
                    <option value="price_asc">Cena: rosnąco</option>
                    <option value="price_desc">Cena: malejąco</option>
                    <option value="name_asc">Nazwa: A - Z</option>
                </select>
            </div>

            <div id="pagination-container-top" class="pagination-wrapper" style="margin-bottom:16px;"></div>

            <div id="products-grid" class="products-grid grid-cols-3">
                <!-- Dynamically loaded products -->
            </div>
        </div>
    </div>

    <!-- Product Details Modal -->
    <div id="product-modal" class="modal-overlay" onclick="closeModalOnOverlay(event)">
        <div class="modal-content">
            <button class="modal-close-btn" onclick="closeModal()">✕</button>
            <div>
                <div class="modal-main-img-box">
                    <img id="modal-main-img" class="modal-main-img" src="" alt="Zdjęcie produktu" onclick="openFullscreenImg(this.src)" title="Kliknij, aby powiększyć na pełny ekran">
                </div>
                <div id="modal-thumbnails" class="modal-thumbnails"></div>
            </div>
            <div style="display:flex; flex-direction:column; gap:12px;">
                <span id="modal-category" style="font-size:12px; font-weight:700; color:var(--accent-primary); text-transform:uppercase;"></span>
                <h2 id="modal-title" style="font-size:22px; font-weight:800; color:#fff;"></h2>
                <div id="modal-price-container"></div>
                <div id="modal-weight-container" style="font-size:13px; color:var(--text-muted);"></div>
                {% if is_admin_ip %}
                <div id="modal-location-container" style="font-size:13px; color:#6ee7b7; font-weight:600;"></div>
                {% endif %}
                <hr style="border:0; border-top:1px solid var(--border-color);">
                <div style="font-size:13px; font-weight:600; color:var(--text-muted);">OPIS PRZEDMIOTU:</div>
                <div id="modal-desc" style="font-size:14px; line-height:1.6; color:#e2e8f0; white-space:pre-wrap;"></div>
            </div>
        </div>
    </div>

    <!-- Fullscreen Image Lightbox -->
    <div id="fullscreen-img-modal" class="fullscreen-img-overlay" onclick="closeFullscreenImgOnOverlay(event)">
        <button type="button" class="fullscreen-close-btn" onclick="closeFullscreenImg()" title="Zamknij pełny ekran">✕</button>
        <img id="fullscreen-img-el" src="" alt="Pełny ekran">
    </div>

    <script>
        const APP_BASE_PATH = "{{ app_base_path|default('/wyprzedaz') }}";
        const API_BASE_PATH = "{{ api_base_path|default('/api/wyprzedaz') }}";
        const LAYOUT_STORAGE_KEY = `catalog_layout_prefs_${APP_BASE_PATH}`;
        const LAYOUT_OPTIONS = {
            3: [6, 9, 12, 'all'],
            4: [8, 12, 16, 'all'],
            5: [10, 15, 20, 'all']
        };
        let allProducts = [];
        let categoryTree = [];
        let selectedCategoryId = null;
        let currentModalProdId = null;
        let currentPage = 1;
        let gridColumns = 3;
        let itemsPerPage = 6;

        function loadLayoutPrefs() {
            try {
                const raw = sessionStorage.getItem(LAYOUT_STORAGE_KEY) || localStorage.getItem(LAYOUT_STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    const cols = parseInt(parsed.cols);
                    if (LAYOUT_OPTIONS[cols]) {
                        gridColumns = cols;
                        const allowed = LAYOUT_OPTIONS[cols];
                        const pp = parsed.perPage === 'all' ? 'all' : parseInt(parsed.perPage);
                        itemsPerPage = allowed.includes(pp) ? pp : allowed[0];
                    }
                }
            } catch (e) {
                console.warn("Błąd odczytu ustawień układu z sesji:", e);
            }
            renderLayoutPicker();
        }

        function saveLayoutPrefs() {
            try {
                const payload = JSON.stringify({ cols: gridColumns, perPage: itemsPerPage });
                sessionStorage.setItem(LAYOUT_STORAGE_KEY, payload);
                localStorage.setItem(LAYOUT_STORAGE_KEY, payload);
            } catch (e) {
                console.warn("Błąd zapisu ustawień układu w sesji:", e);
            }
        }

        function renderLayoutPicker() {
            const summaryEl = document.getElementById('layout-picker-summary');
            if (summaryEl) {
                const ppLabel = itemsPerPage === 'all' ? 'wszystko' : itemsPerPage;
                summaryEl.textContent = `${gridColumns} / ${ppLabel}`;
            }

            const colsContainer = document.getElementById('layout-cols-pills');
            if (colsContainer) {
                colsContainer.innerHTML = [3, 4, 5].map(c => `
                    <button type="button" class="layout-pill-btn ${gridColumns === c ? 'active' : ''}" onclick="selectGridCols(${c})">${c}</button>
                `).join('');
            }

            const rowsContainer = document.getElementById('layout-rows-pills');
            if (rowsContainer) {
                const opts = LAYOUT_OPTIONS[gridColumns] || LAYOUT_OPTIONS[3];
                rowsContainer.innerHTML = opts.map(opt => {
                    const label = opt === 'all' ? 'wszystko' : opt;
                    const isActive = itemsPerPage === opt;
                    const arg = opt === 'all' ? "'all'" : opt;
                    return `<button type="button" class="layout-pill-btn ${isActive ? 'active' : ''}" onclick="selectGridPerPage(${arg})">${label}</button>`;
                }).join('');
            }
        }

        function toggleLayoutPopover(e) {
            if (e) e.stopPropagation();
            const pop = document.getElementById('layout-popover');
            const trig = document.getElementById('layout-picker-trigger');
            if (!pop) return;
            const isOpen = pop.classList.toggle('open');
            if (trig) trig.classList.toggle('open', isOpen);
        }

        function closeLayoutPopover() {
            const pop = document.getElementById('layout-popover');
            const trig = document.getElementById('layout-picker-trigger');
            if (pop) pop.classList.remove('open');
            if (trig) trig.classList.remove('open');
        }

        function selectGridCols(cols) {
            if (!LAYOUT_OPTIONS[cols]) return;
            const prevOpts = LAYOUT_OPTIONS[gridColumns] || LAYOUT_OPTIONS[3];
            const prevIdx = prevOpts.indexOf(itemsPerPage);
            gridColumns = cols;
            const nextOpts = LAYOUT_OPTIONS[cols];
            if (itemsPerPage === 'all') {
                itemsPerPage = 'all';
            } else if (prevIdx >= 0 && prevIdx < nextOpts.length) {
                itemsPerPage = nextOpts[prevIdx];
            } else {
                itemsPerPage = nextOpts[0];
            }
            currentPage = 1;
            saveLayoutPrefs();
            renderLayoutPicker();
            filterProducts(true);
        }

        function selectGridPerPage(val) {
            const allowed = LAYOUT_OPTIONS[gridColumns] || LAYOUT_OPTIONS[3];
            const parsed = val === 'all' ? 'all' : parseInt(val);
            itemsPerPage = allowed.includes(parsed) ? parsed : allowed[0];
            currentPage = 1;
            saveLayoutPrefs();
            renderLayoutPicker();
            closeLayoutPopover();
            filterProducts(true);
        }

        document.addEventListener('click', (e) => {
            const wrapper = document.getElementById('layout-picker-wrapper');
            if (wrapper && !wrapper.contains(e.target)) {
                closeLayoutPopover();
            }
        });

        function updateUrlParams(catId = selectedCategoryId, prodId = currentModalProdId) {
            const url = new URL(window.location);
            if (catId) {
                url.searchParams.set('kategoria', catId);
            } else {
                url.searchParams.delete('kategoria');
            }
            if (prodId) {
                url.searchParams.set('produkt', prodId);
            } else {
                url.searchParams.delete('produkt');
            }
            history.replaceState(null, '', url.pathname + url.search);
        }

        function isAncestorOrSelf(cat, targetId) {
            if (!targetId) return false;
            if (cat.id === targetId) return true;
            if (cat.children && cat.children.length > 0) {
                return cat.children.some(c => isAncestorOrSelf(c, targetId));
            }
            return false;
        }

        async function initData() {
            loadLayoutPrefs();
            const params = new URLSearchParams(window.location.search);
            const catParam = params.get('kategoria');
            const prodParam = params.get('produkt');
            if (catParam) {
                selectedCategoryId = catParam;
            }

            await loadCategories();
            await loadProducts();

            if (prodParam) {
                openModal(prodParam, false);
            }
        }

        window.addEventListener('popstate', () => {
            const params = new URLSearchParams(window.location.search);
            selectedCategoryId = params.get('kategoria') || null;
            const prodParam = params.get('produkt');
            renderCategoryTree();
            filterProducts(true);
            if (prodParam) {
                openModal(prodParam, false);
            } else {
                closeModal(false);
            }
        });

        async function loadCategories() {
            try {
                const res = await fetch(`${API_BASE_PATH}/categories`);
                categoryTree = await res.json();
                renderCategoryTree();
            } catch(e) {
                console.error("Błąd pobierania kategorii:", e);
            }
        }

        function getValidCategoryIdsSet(cats = categoryTree) {
            const set = new Set();
            function traverse(list) {
                if (!list) return;
                list.forEach(c => {
                    set.add(c.id);
                    if (c.children && c.children.length > 0) traverse(c.children);
                });
            }
            traverse(cats);
            return set;
        }

        function getSubtreeCatIds(catId, cats = categoryTree) {
            const set = new Set();
            function findAndCollect(list) {
                for (let c of list) {
                    if (c.id === catId) {
                        collectAll(c);
                        return true;
                    }
                    if (c.children && c.children.length > 0) {
                        if (findAndCollect(c.children)) return true;
                    }
                }
                return false;
            }
            function collectAll(c) {
                set.add(c.id);
                if (c.children) c.children.forEach(collectAll);
            }
            findAndCollect(cats);
            return set;
        }

        function getSubtreeStats(cat, validProducts) {
            const subIds = getSubtreeCatIds(cat.id);
            let availableStockSum = 0;
            let visibleItemsCount = 0;
            for (const p of validProducts) {
                if (p.kategoria_id && subIds.has(p.kategoria_id)) {
                    visibleItemsCount++;
                    const qty = (p.ilosc !== undefined && p.ilosc !== null) ? parseInt(p.ilosc) : 1;
                    if (qty > 0) {
                        availableStockSum += qty;
                    }
                }
            }
            return { availableStockSum, visibleItemsCount };
        }

        function renderCategoryTree() {
            const container = document.getElementById('category-tree-container');
            const validCatIds = getValidCategoryIdsSet();

            // Filtrujemy widoczne produkty, które posiadają PRAWIDŁOWĄ kategorię
            const validProducts = allProducts.filter(p => p.widocznosc !== false && p.kategoria_id && validCatIds.has(p.kategoria_id));
            const totalValidCount = validProducts.reduce((sum, p) => {
                const qty = (p.ilosc !== undefined && p.ilosc !== null) ? parseInt(p.ilosc) : 1;
                return sum + (qty > 0 ? qty : 0);
            }, 0);

            let html = `
                <div class="cat-item ${selectedCategoryId === null ? 'active' : ''}" onclick="selectCategory(null)" style="display:flex; justify-content:space-between; align-items:center;">
                    <span>Wszystkie kategorie</span>
                    <span class="count-badge">${totalValidCount}</span>
                </div>
            `;

            function buildCatHtml(cat, depth = 0) {
                const { availableStockSum: prodCount, visibleItemsCount } = getSubtreeStats(cat, validProducts);
                const isSelectedPath = isAncestorOrSelf(cat, selectedCategoryId);

                // Ukryj kategorie bez żadnych widocznych produktów - WYJĄTKIEM są kategorie na ścieżce wybranej z URL
                if (visibleItemsCount === 0 && !isSelectedPath) return '';

                const isActive = selectedCategoryId === cat.id;
                const prefix = depth > 0 ? '└─ '.repeat(depth) : '';
                let subHtml = '';
                if (cat.children && cat.children.length > 0) {
                    const sortedChildren = [...cat.children].sort((a,b) => a.name.localeCompare(b.name, 'pl'));
                    const renderedChildren = sortedChildren.map(c => buildCatHtml(c, depth + 1)).join('');
                    if (renderedChildren.trim()) {
                        subHtml = `<div class="cat-sub-list" style="margin-left: 12px;">${renderedChildren}</div>`;
                    }
                }
                return `
                    <div class="cat-item ${isActive ? 'active' : ''}" onclick="selectCategory('${cat.id}')" style="display:flex; justify-content:space-between; align-items:center;">
                        <span>${prefix}${cat.name}</span>
                        <span class="count-badge">${prodCount}</span>
                    </div>
                    ${subHtml}
                `;
            }

            const sortedRoots = [...categoryTree].sort((a,b) => a.name.localeCompare(b.name, 'pl'));
            sortedRoots.forEach(cat => {
                html += buildCatHtml(cat, 0);
            });

            container.innerHTML = html;
        }

        function selectCategory(catId) {
            selectedCategoryId = catId;
            updateUrlParams(selectedCategoryId, currentModalProdId);
            renderCategoryTree();
            filterProducts(true);
        }

        async function loadProducts() {
            try {
                const res = await fetch(`${API_BASE_PATH}/products`);
                allProducts = await res.json();
                renderCategoryTree();
                filterProducts(true);
            } catch(e) {
                console.error("Błąd pobierania produktów:", e);
            }
        }

        function getCategoryName(catId) {
            function findCat(cats) {
                for (let c of cats) {
                    if (c.id === catId) return c.name;
                    if (c.children && c.children.length > 0) {
                        let f = findCat(c.children);
                        if (f) return f;
                    }
                }
                return null;
            }
            return findCat(categoryTree) || "Inne";
        }

        function getPriceInfo(cena) {
            if (cena === undefined || cena === null || String(cena).trim() === '') {
                return { hasPrice: false, text: '', isFree: false, val: null };
            }
            const cleanStr = String(cena).trim().replace(',', '.');
            const num = parseFloat(cleanStr);
            if (!isNaN(num) && num === 0) {
                return { hasPrice: true, text: 'Za darmo', isFree: true, val: 0 };
            }
            return { hasPrice: true, text: `${cena} PLN`, isFree: false, val: isNaN(num) ? 0 : num };
        }

        function parsePrice(priceStr) {
            const info = getPriceInfo(priceStr);
            return info.val;
        }

        function parseSearchQuery(query) {
            if (!query || !query.trim()) return [];
            const regex = /"([^"]+)"|'([^']+)'|(\S+)/g;
            const terms = [];
            let match;
            while ((match = regex.exec(query)) !== null) {
                const term = match[1] || match[2] || match[3];
                if (term && term.trim()) {
                    terms.push(term.trim().toLowerCase());
                }
            }
            return terms;
        }

        function filterProducts(resetPage = true) {
            if (resetPage) {
                currentPage = 1;
            }

            const validCatIds = getValidCategoryIdsSet();
            const rawQuery = document.getElementById('search-input').value;
            const searchTerms = parseSearchQuery(rawQuery);
            const sortVal = document.getElementById('sort-select').value;

            let filtered = allProducts.filter(p => {
                const isVisible = p.widocznosc !== false;
                if (!isVisible) return false;

                // WARUNEK: Odrzuć produkty z błędnymi / usuniętymi kategoriami!
                if (!p.kategoria_id || !validCatIds.has(p.kategoria_id)) {
                    return false;
                }

                // Filtrowanie wg wybranej kategorii (wraz z jej podkategoriami)
                if (selectedCategoryId !== null) {
                    const subCatIds = getSubtreeCatIds(selectedCategoryId);
                    if (!subCatIds.has(p.kategoria_id)) return false;
                }
                
                let matchQuery = true;
                if (searchTerms.length > 0) {
                    const targetText = ((p.nazwa || '') + ' ' + (p.opis || '')).toLowerCase();
                    matchQuery = searchTerms.every(term => targetText.includes(term));
                }

                return matchQuery;
            });

            if (sortVal === 'price_asc') {
                filtered.sort((a,b) => {
                    const pa = parsePrice(a.cena);
                    const pb = parsePrice(b.cena);
                    if (pa === null && pb === null) return 0;
                    if (pa === null) return 1;
                    if (pb === null) return -1;
                    return pa - pb;
                });
            } else if (sortVal === 'price_desc') {
                filtered.sort((a,b) => {
                    const pa = parsePrice(a.cena);
                    const pb = parsePrice(b.cena);
                    if (pa === null && pb === null) return 0;
                    if (pa === null) return 1;
                    if (pb === null) return -1;
                    return pb - pa;
                });
            } else if (sortVal === 'name_asc') {
                filtered.sort((a,b) => a.nazwa.localeCompare(b.nazwa, 'pl'));
            } else {
                filtered.sort((a,b) => (b.created_at || '').localeCompare(a.created_at || ''));
            }

            // Stronnicowanie wg wybranej liczby kolumn (3, 4, 5) oraz limitu na stronę
            const totalItems = filtered.length;
            let pageProducts = [];
            let totalPages = 1;

            const gridEl = document.getElementById('products-grid');
            if (gridEl) {
                gridEl.classList.remove('grid-cols-3', 'grid-cols-4', 'grid-cols-5');
                gridEl.classList.add(`grid-cols-${gridColumns}`);
            }

            if (itemsPerPage === 'all') {
                currentPage = 1;
                totalPages = 1;
                pageProducts = filtered;
            } else {
                totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
                if (currentPage > totalPages) currentPage = totalPages;
                if (currentPage < 1) currentPage = 1;

                const startIdx = (currentPage - 1) * itemsPerPage;
                pageProducts = filtered.slice(startIdx, startIdx + itemsPerPage);
            }

            renderProductsGrid(pageProducts);
            renderPagination(totalItems);
            renderCategoryTree();
        }

        function buildPaginationHtml(totalItems) {
            const totalPages = (itemsPerPage === 'all') ? 1 : (Math.ceil(totalItems / itemsPerPage) || 1);

            let html = '';
            html += `<button class="page-btn" ${currentPage <= 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">◀ Poprzednia</button>`;

            for (let i = 1; i <= totalPages; i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
            }

            html += `<button class="page-btn" ${currentPage >= totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">Następna ▶</button>`;
            html += `<span class="page-info">(Strona ${currentPage} z ${totalPages}, łącznie ${totalItems} szt.)</span>`;
            return html;
        }

        function renderPagination(totalItems) {
            const topContainer = document.getElementById('pagination-container-top');
            if (topContainer) topContainer.innerHTML = buildPaginationHtml(totalItems);
        }

        function changePage(page) {
            currentPage = page;
            filterProducts(false);
            window.scrollTo({ top: document.getElementById('search-input').offsetTop - 80, behavior: 'smooth' });
        }

        function renderProductsGrid(products) {
            const grid = document.getElementById('products-grid');
            if (!products || products.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:40px; color:var(--text-muted);">Brak dostępnych sprzętów w tej kategorii.</div>';
                return;
            }

            grid.innerHTML = products.map(p => {
                const mainImg = (p.zdjecia && p.zdjecia.length > 0) ? p.zdjecia[0] : null;
                const imgCount = (p.zdjecia && p.zdjecia.length) || 0;
                const catName = getCategoryName(p.kategoria_id);
                const qtyVal = (p.ilosc !== undefined && p.ilosc !== null) ? parseInt(p.ilosc) : 1;
                const isOutOfStock = (qtyVal <= 0);

                const priceInfo = getPriceInfo(p.cena);
                let priceHtml = '';
                if (priceInfo.hasPrice) {
                    if (priceInfo.isFree) {
                        priceHtml = `
                            <div class="product-price" style="color:var(--accent-green);">
                                🎁 Za darmo ${isOutOfStock ? '<small style="font-size:11px; color:#fca5a5;">(Niedostępny)</small>' : ''}
                            </div>
                        `;
                    } else {
                        priceHtml = `
                            <div class="product-price ${isOutOfStock ? 'out-of-stock-price' : ''}">
                                ${priceInfo.text} ${isOutOfStock ? '<small style="font-size:11px; color:#fca5a5;">(Niedostępny)</small>' : ''}
                            </div>
                        `;
                    }
                }

                return `
                    <div class="product-card" onclick="openModal('${p.id}')">
                        <div class="product-img-wrapper ${isOutOfStock ? 'out-of-stock' : ''}">
                            ${mainImg ? `<img src="${mainImg}" alt="${p.nazwa}">` : '<div class="no-img-placeholder">📷</div>'}
                            <span class="badge-category">${catName}</span>
                            ${isOutOfStock ? `<span class="badge-out-of-stock">⛔ BRAK DOSTĘPNOŚCI</span>` : ''}
                            ${imgCount > 1 ? `<span class="badge-img-count">📷 ${imgCount} zdjęć</span>` : ''}
                        </div>
                        <div class="product-info">
                            <div class="product-title">(${qtyVal} szt) ${p.nazwa}</div>
                            ${priceHtml}
                            <div class="product-desc-short">${p.opis}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openModal(prodId, shouldUpdateUrl = true) {
            const prod = allProducts.find(p => p.id === prodId);
            if (!prod) return;

            currentModalProdId = prodId;
            if (shouldUpdateUrl) {
                updateUrlParams(selectedCategoryId, prodId);
            }

            const isOutOfStock = (prod.ilosc !== undefined && prod.ilosc !== null && parseInt(prod.ilosc) <= 0);
            const qtyVal = (prod.ilosc !== undefined && prod.ilosc !== null) ? parseInt(prod.ilosc) : 1;

            document.getElementById('modal-title').textContent = prod.nazwa;
            document.getElementById('modal-desc').textContent = prod.opis;
            document.getElementById('modal-category').textContent = getCategoryName(prod.kategoria_id);

            const priceInfo = getPriceInfo(prod.cena);
            const priceContainer = document.getElementById('modal-price-container');

            let priceSpanHtml = '';
            if (priceInfo.hasPrice) {
                if (priceInfo.isFree) {
                    priceSpanHtml = `<span style="font-size:24px; font-weight:800; color:var(--accent-green);">🎁 Za darmo</span>`;
                } else {
                    const color = isOutOfStock ? '#fca5a5' : 'var(--accent-gold)';
                    priceSpanHtml = `<span style="font-size:24px; font-weight:800; color:${color};">${priceInfo.text}</span>`;
                }
            }

            if (isOutOfStock) {
                priceContainer.innerHTML = `
                    <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
                        ${priceSpanHtml}
                        <span style="background:rgba(239,68,68,0.25); color:#fca5a5; font-size:13px; font-weight:800; padding:4px 10px; border-radius:4px; border:1px solid rgba(239,68,68,0.4);">⛔ BRAK DOSTĘPNOŚCI (Ilość: 0 szt.)</span>
                    </div>
                `;
            } else {
                priceContainer.innerHTML = `
                    <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
                        ${priceSpanHtml}
                        <span style="background:rgba(16,185,129,0.2); color:#6ee7b7; font-size:13px; font-weight:600; padding:4px 10px; border-radius:4px; border:1px solid rgba(16,185,129,0.4);">✅ Dostępna ilość: ${qtyVal} szt.</span>
                    </div>
                `;
            }

            const weightContainer = document.getElementById('modal-weight-container');
            if (prod.waga_jednostkowa && prod.waga_jednostkowa.trim()) {
                weightContainer.innerHTML = `⚖️ Waga jednostkowa: <strong style="color:#fff;">${prod.waga_jednostkowa}</strong>`;
                weightContainer.style.display = 'block';
            } else {
                weightContainer.style.display = 'none';
            }

            const locationContainer = document.getElementById('modal-location-container');
            if (locationContainer) {
                if (prod.lokalizacja && prod.lokalizacja.trim()) {
                    locationContainer.innerHTML = `📍 Lokalizacja magazynowa: <strong style="color:#fff;">${prod.lokalizacja}</strong>`;
                    locationContainer.style.display = 'block';
                } else {
                    locationContainer.style.display = 'none';
                }
            }

            const mainImg = document.getElementById('modal-main-img');
            const thumbsContainer = document.getElementById('modal-thumbnails');

            if (isOutOfStock) {
                mainImg.classList.add('out-of-stock');
            } else {
                mainImg.classList.remove('out-of-stock');
            }

            if (prod.zdjecia && prod.zdjecia.length > 0) {
                mainImg.src = prod.zdjecia[0];
                mainImg.style.display = 'block';

                thumbsContainer.innerHTML = prod.zdjecia.map((img, idx) => `
                    <img src="${img}" class="modal-thumb ${idx === 0 ? 'active' : ''}" onclick="setModalMainImg('${img}', this)">
                `).join('');
            } else {
                mainImg.src = '';
                mainImg.style.display = 'none';
                thumbsContainer.innerHTML = '';
            }

            document.getElementById('product-modal').style.display = 'flex';
        }

        function setModalMainImg(src, thumbElem) {
            document.getElementById('modal-main-img').src = src;
            document.querySelectorAll('.modal-thumb').forEach(t => t.classList.remove('active'));
            if (thumbElem) thumbElem.classList.add('active');
        }

        function openFullscreenImg(src) {
            if (!src) return;
            const imgEl = document.getElementById('fullscreen-img-el');
            const overlay = document.getElementById('fullscreen-img-modal');
            if (imgEl && overlay) {
                imgEl.src = src;
                overlay.style.display = 'flex';
            }
        }

        function closeFullscreenImg() {
            const overlay = document.getElementById('fullscreen-img-modal');
            if (overlay) {
                overlay.style.display = 'none';
                document.getElementById('fullscreen-img-el').src = '';
            }
        }

        function closeFullscreenImgOnOverlay(e) {
            if (e.target.id === 'fullscreen-img-modal') closeFullscreenImg();
        }

        function closeModal(shouldUpdateUrl = true) {
            currentModalProdId = null;
            document.getElementById('product-modal').style.display = 'none';
            if (shouldUpdateUrl) {
                updateUrlParams(selectedCategoryId, null);
            }
        }

        function closeModalOnOverlay(e) {
            if (e.target.id === 'product-modal') closeModal();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const fsModal = document.getElementById('fullscreen-img-modal');
                if (fsModal && fsModal.style.display === 'flex') {
                    closeFullscreenImg();
                } else {
                    closeModal();
                }
            }
        });

        document.addEventListener('DOMContentLoaded', initData);
    </script>
</body>
</html>
